name: 📡 Mutiny TV IPTV Pirate Engine v615.5 - Release Core

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      - name: ⚙️ Instalando FFmpeg nativo por hardware en la nube
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl jq

      - name: 🚀 Emisión Directa Unificada hacia Kick Inmune a Caídas de Audio
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v615.5 - DIEGO RELEASE PURIST FIXED]
          export TERM=xterm
          
          # ESCUDO DE TEXTOS MUDO INICIAL
          echo "Cargando..." > letrero.txt
          echo "$NUM_LINEA" > abajo.txt

          echo "Cargando informes Mutiny..." > abajo.txt
          
          URL_GIST_NOTICIAS="https://gist.githubusercontent.com/jav45dev-ctrl/dbe1c5ce7ae9ceb4596c07ddf99fab18/raw/noticias.txt"
          # Hilo de la marquesina inferior de noticias en background intacto
          while true; do curl -s "$URL_GIST_NOTICIAS" | head -n 1 | tr -d '\r\n' > abajo.txt; sleep 5; done &

          # 🧱 [EL SEGURO DE LA MARATÓN]: Inicializamos el contador de fila india
          echo "1" > linea_actual.txt

          echo "📡 [MUTINY TV] ENCIENDIENDO CAÑO MAESTRO DE EMISIÓN DE LARGO FLUIDO..."
          
          while true; do
            # Descargamos tu playlist unificada del Gist privado
            curl "https://gist.githubusercontent.com/jav45dev-ctrl/dbe1c5ce7ae9ceb4596c07ddf99fab18/raw/playlist.txt" | tr -d '\r' | sed '/^$/d' > grilla_local.txt
            NUM_LINEA=$(cat linea_actual.txt)
            
            # Capturamos la línea completa rígida del casillero correspondiente (URL | TITULO)
            LINEA_CRUDA=$(sed -n "${NUM_LINEA}p" grilla_local.txt)

            if [ -z "$LINEA_CRUDA" ]; then
              echo "🔄 Fin de la cartelera de hoy. Pegando la vuelta al Renglón 1..."
              echo "1" > linea_actual.txt
              sleep 5; continue
            fi

            # 🛠️ DISECCIÓN AUTOMÁTICA DETECTOR DE TÍTULOS DEBOXES
            # Usamos awk para escupir la URL limpia eliminando espacios
            URL_PIRATA=$(echo "$LINEA_CRUDA" | awk -F'|' '{print $1}' | tr -d ' ')
            # Usamos sed para limpiar los espacios sobrantes de las puntas del título
            TITULO_LETRERO=$(echo "$LINEA_CRUDA" | awk -F'|' '{print $2}' | sed 's/^[ \t]*//;s/[ \t]*$//')

            # Inyectamos de forma síncrona el título adentro del archivo letrero.txt
            echo "$TITULO_LETRERO" > letrero.txt

            echo "🍿 [MUTINY] REPRODUCIENDO RENGLÓN DE GRILLA NÚMERO: $NUM_LINEA"
            echo "🎬 Título Letrero: $TITULO_LETRERO"
            echo "🔗 Link: $URL_PIRATA"

            # 🪓 TU COMANDO ORIGINAL SANO: Con el video primero y la plantilla atrás para que no crashee
            # Mantiene intacto el timeout y los filtros de escala con crop que a vos te gustan deboxes.
            # 🪓 [REPARADO DEFINITIVO v615.5 - SIN TIMEOUT ANTI-SALTOS]
            ffmpeg -y -headers "Authorization: token ${{ secrets.TOKEN_B }}\r\nUser-Agent: VLC/3.0.18 LibVLC/3.0.18" -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 -fflags +genpts+igndts+flush_packets+discardcorrupt+nofillin -re -async 1 -i "$URL_PIRATA" -re -loop 1 -i plantilla_horizontal.png -filter_complex "[0:v]scale=1280:720,crop=1270:710:5:5,eq=contrast=1.12:brightness=0.02,rotate=0.012:ow=1280:oh=720:fillcolor=black[peli_expandida]; [1:v]scale=1280:720[fondo_base]; [fondo_base][peli_expandida]overlay=0:0:shortest=1[canvas_parcial]; [canvas_parcial]drawtext=textfile=letrero.txt:reload=1:x=30:y=25:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.6:boxborderw=5,drawtext=textfile=abajo.txt:reload=1:x=30:y=665:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.5:boxborderw=4[canvas_fusionado]" -r 30 -g 60 -keyint_min 60 -map 0:a:0? -map "[canvas_fusionado]" -sn -dn -pix_fmt yuv420p -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 12000k -c:a aac -b:a 128k -ac 2 -ar 44100 -af aresample=async=1 -f flv "rtmps://fa723fc1b171.global-contribute.live-video.net/app/sk_us-west-2_yb6F1b18xTEE_QpaA7pm407C0FAAGgZPTqZHvtIJM2Q" || true


            echo "🏁 Transición de bloque detectada. Saltando de renglón..."
            echo "$((NUM_LINEA + 1))" > linea_actual.txt
            sleep 3
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
