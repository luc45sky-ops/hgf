name: 🪓 Mutiny TV - Master Unificador VOD de Largo Fluido v1.0

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub para armar el cartucho

# [REPARADO DEFINITIVO v3.9 - PASAPORTE DE ESCRITURA VIRGEN]
permissions:
  contents: write
  actions: write

jobs:
  unificar_maraton:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      # Setup FFmpeg ultra-rápido en 4 segundos sordos sin updates parásitos de Linux
      - name: ⚙️ Setup FFmpeg Nativo en la Nube
        uses: federicocarboni/setup-ffmpeg@v3

      - name: 🚀 Descarga Satelital y Costura Binaria de Películas (Peso Pluma Original)
        run: |
          # 🪓 [REACTOR DE RELEVOS v3.9 - CUENTA NUEVA RE-INDEXADA]
          export TERM=xterm
          
          echo "📡 [MUTINY TV] EMPEZANDO PROCESO DE UNIFICACIÓN CRIPTOGRÁFICA..."
          
          # 1. Chupamos tu playlist unificada del Gist privado donde dejaste los capítulos en fila india
          curl -s "https://gist.githubusercontent.com/jav45dev-ctrl/36a0241efb9e52e647e15a969eaa8459/raw/prueba_uni.txt" | tr -d '\r' | sed '/^$/d' > lista_gist.txt
          
          echo "# Lista de archivos para concat" > inputs_ffmpeg.txt
          contador=1
          
          # 2. El bucle satelital: descarga los .mp4/.mkv uno por uno a la RAM a velocidad de cohete
          while read -r linea || [ -n "$linea" ]; do
            URL_VIDEO=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            
            if [ -n "$URL_VIDEO" ]; then
              echo "📥 Descargando e inyectando Tramo $contador: $URL_VIDEO"
              
              # Saltamos las aduanas de GitHub con tu cabecera VLC y el nuevo TOKEN_B del tablero
              curl -L -H "Authorization: token ${{ secrets.TOKEN_B }}" \
                   -H "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
                   -o "origen_${contador}.mp4" "$URL_VIDEO"
              
              echo "file 'origen_${contador}.mp4'" >> inputs_ffmpeg.txt
              contador=$((contador + 1))
            fi
          done < lista_gist.txt

          echo "🪓 [MUTINY] UNIFICANDO BORDES BINARIOS RE-INDEXANDO TIEMPOS..."
          
          # 3. LA CRÍA MAESTRA: Concat demuxer por copia directa binaria (-c copy)
          # Forzamos +genpts+igndts al inicio y al final para recalcular las líneas de tiempo rotas,
          # eliminando el bache del VLC, manteniendo tu HD nativo intacto y sin inflar artificialmente el peso.
          ffmpeg -y -fflags +genpts+igndts -f concat -safe 0 -i inputs_ffmpeg.txt -c copy -fflags +genpts+igndts maraton_perfecta.mp4

          echo "✅ Súper-video soldado en la gatera nueva manteniendo la calidad nativa."
          ls -lh maraton_perfecta.mp4

      # Guardamos el fideo de 1.24 GB en un cofre virgen y público adentro de tu Cuenta Nueva
      - name: 📦 Guardando Cartucho en las Releases del Repositorio (Auditoría Libre)
        uses: softprops/action-gh-release@v2
        with:
          files: maraton_perfecta.mp4
          tag_name: maraton_soberana
          name: "🍿 Mutiny TV - Maratones Continuas Masterizadas"
          body: "Este archivo se unificó por copia directa binaria re-indexada en cuenta limpia separada. Mantiene la calidad original intacta y pesa menos de 2GB."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
