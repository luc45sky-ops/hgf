name: 🪓 Mutiny TV - Master Unificador VOD de Largo Fluido v1.0

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub para armar el cartucho

# 🪓 [REPARADO DEFINITIVO v5.5 - PERMISOS DE ESCRITURA INYECTADOS NATIVOS]
permissions:
  contents: write
  actions: write

jobs:
  unificar_maraton:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      # Setup FFmpeg ultra-rápido en 4 segundos sordos sin muga de updates eternos
      - name: ⚙️ Setup FFmpeg Nativo en la Nube
        uses: federicocarboni/setup-ffmpeg@v3

      - name: 🚀 Descarga Satelital y Costura Binaria de Películas (Peso Pluma Original)
        run: |
          # 🪓 [REACTOR DE RELEVOS v5.5 - COPIA DIRECTA RE-INDEXADA DIEGO CORE]
          export TERM=xterm
          
          # Fabricamos una marca de tiempo única rígida para que la caché de la API jamás te de portazos
          FECHA_BOXES=$(date +'%d_%m_%H_%M')
          echo "CODENAME_MARATON=maraton_${FECHA_BOXES}" >> $GITHUB_ENV
          
          echo "📡 [MUTINY TV] EMPEZANDO PROCESO DE UNIFICACIÓN CRIPTOGRÁFICA..."
          
          # 1. Chupamos tu playlist unificada del Gist privado donde dejaste las películas moldeadas
          curl -s "https://gist.githubusercontent.com/jav45dev-ctrl/36a0241efb9e52e647e15a969eaa8459/raw/prueba_uni.txt" | tr -d '\r' | sed '/^$/d' > lista_gist.txt
          
          echo "# Lista de archivos para concat" > inputs_ffmpeg.txt
          contador=1
          
          # 2. Descarga a velocidad satelital de servidor a servidor en la memoria virtual
          while read -r linea || [ -n "$linea" ]; do
            URL_VIDEO=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            
            if [ -n "$URL_VIDEO" ]; then
              echo "📥 Descargando e inyectando Tramo $contador: $URL_VIDEO"
              
              # Chupamos el video saltando las aduanas con tu cabecera VLC y el TOKEN_B del tablero
              curl -L -H "Authorization: token ${{ secrets.TOKEN_B }}" \
                   -H "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
                   -o "origen_${contador}.mp4" "$URL_VIDEO"
              
              echo "file 'origen_${contador}.mp4'" >> inputs_ffmpeg.txt
              contador=$((contador + 1))
            fi
          done < lista_gist.txt

          echo "🪓 [MUTINY] UNIFICANDO BORDES BINARIOS CON RE-INDEXADO DE TIEMPOS..."
          
          # 3. LA CRÍA MAESTRA: Concat demuxer por copia directa binaria (-c copy)
          # Al meterle el flag -async 1 y forzar +genpts+igndts al inicio y al final del contenedor,
          # re-escribimos las marcas de tiempo rotas, eliminando el bache en negro de VLC y Kick deBoxes.
          ffmpeg -y -fflags +genpts+igndts -f concat -safe 0 -i inputs_ffmpeg.txt -c copy -async 1 -fflags +genpts+igndts "maraton_${FECHA_BOXES}.mp4"

          echo "✅ Súper-video soldado en un solo caño manteniendo el peso liviano original."
          ls -lh "maraton_${FECHA_BOXES}.mp4"

      # Guardamos el archivo entero de 1.2 GB en un cofre virgen dinámico separado en tu Cuenta Nueva
      - name: 📦 Guardando Cartucho en las Releases del Repositorio (Auditoría Libre)
        uses: softprops/action-gh-release@v2
        with:
          files: "maraton_${{ env.CODENAME_MARATON }}.mp4"
          tag_name: "${{ env.CODENAME_MARATON }}"
          name: "🍿 Mutiny TV - Cartucho Masterizado ${{ env.CODENAME_MARATON }}"
          body: "Esta maratón se unificó por copia directa binaria re-indexada. Mantiene la calidad original intacta, pesa menos de 2GB y repara saltos de tiempo gracias al ADN unificado del Ladrón v5.2."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

       
