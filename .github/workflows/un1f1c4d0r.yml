name: 🪓 Mutiny TV - Master Unificador VOD de Largo Fluido v1.0

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub para armar el cartucho

permissions:
  contents: write
  actions: write

jobs:
  unificar_maraton:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      # Setup FFmpeg ultra-rápido en 4 segundos sordos
      - name: ⚙️ Setup FFmpeg Nativo en la Nube
        uses: federicocarboni/setup-ffmpeg@v3

      - name: 🚀 Descarga Satelital y Re-Renderizado Líquido de Películas (ADN Unificado CRF)
        run: |
          # 🪓 [REACTOR DE RELEVOS v4.6 - CRF UNIQUE TIMESTAMP CORE]
          export TERM=xterm
          
          # Fabricamos una marca de tiempo única rígida para que GitHub jamás confunda el archivo
          FECHA_BOXES=$(date +'%d_%m_%H_%M')
          echo "CODENAME_MARATON=maraton_${FECHA_BOXES}" >> $GITHUB_ENV
          
          echo "📡 [MUTINY TV] EMPEZANDO PROCESO DE UNIFICACIÓN CRIPTOGRÁFICA..."
          
          curl -s "https://gist.githubusercontent.com/jav45dev-ctrl/36a0241efb9e52e647e15a969eaa8459/raw/prueba_uni.txt" | tr -d '\r' | sed '/^$/d' > lista_gist.txt
          
          contador=1
          CADENA_FILTER=""
          
          while read -r linea || [ -n "$linea" ]; do
            URL_VIDEO=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            if [ -n "$URL_VIDEO" ]; then
              echo "📥 Descargando e inyectando Tramo $contador: $URL_VIDEO"
              curl -L -H "Authorization: token ${{ secrets.TOKEN_B }}" \
                   -H "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
                   -o "origen_${contador}.video" "$URL_VIDEO"
              CADENA_FILTER="${CADENA_FILTER} -i origen_${contador}.video"
              contador=$((contador + 1))
            fi
          done < lista_gist.txt

          TOTAL_VIDEOS=$((contador - 1))
          echo "🍿 Total de cartuchos en fila india detectados: $TOTAL_VIDEOS"

          FILTRO_CONCAT=""
          for i in $(seq 0 $((TOTAL_VIDEOS - 1))); do
            FILTRO_CONCAT="${FILTRO_CONCAT}[${i}:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1:1,setpts=PTS-STARTPTS[v${i}]; [${i}:a:0]aresample=async=1,asetpts=PTS-STARTPTS[a${i}]; "
          done
          
          FUSION_FINAL=""
          for i in $(seq 0 $((TOTAL_VIDEOS - 1))); do
            FUSION_FINAL="${FUSION_FINAL}[v${i}][a${i}]"
          done
          FILTRO_CONCAT="${FILTRO_CONCAT}${FUSION_FINAL}concat=n=${TOTAL_VIDEOS}:v=1:a=1[v_out][a_out]"

          echo "🪓 [MUTINY] LICUANDO EL ADN CON COMPRESIÓN CRF ELÁSTICA..."
          
          # Le clavamos el nombre dinámico exclusivo de esta carrera
          ffmpeg -y ${CADENA_FILTER} -filter_complex "${FILTRO_CONCAT}" \
          -map "[v_out]" -map "[a_out]" -r 30 -pix_fmt yuv420p \
          -c:v libx264 -preset ultrafast -crf 23 -g 60 -keyint_min 60 \
          -c:a aac -b:a 128k -ac 2 -ar 44100 "maraton_${FECHA_BOXES}.mp4"

          echo "✅ Súper-video soldado y estabilizado sin sobrepeso."
          ls -lh "maraton_${FECHA_BOXES}.mp4"

      # Guardamos el archivo con su tag único exclusivo inmune a bloqueos de caché
      - name: 📦 Guardando Cartucho en las Releases del Repositorio (Auditoría Libre)
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ env.CODENAME_MARATON }}.mp4"
          tag_name: "${{ env.CODENAME_MARATON }}"
          name: "🍿 Mutiny TV - Cartucho Masterizado ${{ env.CODENAME_MARATON }}"
          body: "Esta maratón se masterizó por re-encode elástico CRF-23 bajo una clave de chapa única. Inmune a baches de red, pantallas negras y bloqueos de caché de la API."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    
