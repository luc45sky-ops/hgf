name: 📡 Mutiny TV - Ladrón de Contenido Síncrono Local

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub con 2 casilleros
    inputs:
      url_pirata:
        description: 'Chorizo de link a clonar (m3u8, mp4, mkv)'
        required: true
        default: 'PONER_URL_AQUÍ'
      nombre_pelicula:
        description: 'Nombre del archivo final terminado strictly en .mp4'
        required: true
        default: 'estreno_mutiny.mp4'

permissions:
  contents: write
  actions: write

jobs:
  descarga_bunker:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando espacio en el disco virtual de Microsoft
        uses: actions/checkout@v4

      # Setup FFmpeg ultra-rápido en 4 segundos sordos
      - name: ⚙️ Setup FFmpeg Nativo en la Nube
        uses: federicocarboni/setup-ffmpeg@v3

      - name: 🚀 Clonación Satelital y Normalización de ADN Multimedia a la RAM
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v5.2 - DIEGO CURL BYPASS CORE]
          export TERM=xterm
          
          echo "📥 FASE 1: Succionando los bytes crudos de internet con el extractor inmune..."
          
          # [REPARADO DEFINITIVO v5.2]: Volamos a ffmpeg de la descarga de red para aplastar el SegFault.
          # Usamos curl -L con tu cabecera VLC para chupar el archivo directo al disco como un bloque de titanio.
          curl -L -A "VLC/3.0.18 LibVLC/3.0.18" -o descarga_cruda.mp4 "${{ github.event.inputs.url_pirata }}"

          # Verificación de chapa anti-bancarrota de la descarga
          if [ ! -s "descarga_cruda.mp4" ]; then
             echo "❌ El extractor de red se congeló o el link caducó en internet. Abortando."
             exit 1
          fi
          
          echo "✅ Descarga completada con éxito. Tamaño del archivo crudo:"
          du -sh descarga_cruda.mp4
          
          echo "📥 FASE 2: Aplicando el Molde de Titanio al archivo local en frío absolute..."
          
          # Como el archivo ya es local, el procesador muerde el video sin baches de red,
          # le aplica el filtro complejo de 1280x720, normaliza el SAR a 1:1 e inyecta los Keyframes fijos (-g 60)
          ffmpeg -y -i descarga_cruda.mp4 \
            -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1:1[v_moldeado]" \
            -map "[v_moldeado]" -map 0:a:0? -r 30 -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -crf 22 -g 60 -keyint_min 60 \
            -c:a aac -b:a 128k -ac 2 -ar 44100 -async 1 "${{ github.event.inputs.nombre_pelicula }}"

          echo "✅ Película estandarizada y blindada al 100% de ADN Mutiny. Peso total real:"
          du -sh "${{ github.event.inputs.nombre_pelicula }}"

      - name: 💾 Inyectando el Video Intacto en las Releases Locales de esta Cuenta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bunker_mutiny"
          name: "📦 Mutiny TV - Base de Datos Privada Soberana"
          body: "Aquí viven tus películas resguardadas eternas en calidad HD unificada, SAR 1:1 y Keyframes sincronizados, listas para transmitir de corrido sin apagar el vivo."
          files: "${{ github.event.inputs.nombre_pelicula }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
