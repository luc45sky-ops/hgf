name: 📡 LADRON DEF

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub con 2 casilleros
    inputs:
      url_pirata:
        description: 'Chorizo de link a clonar (m3u8, mp4, mkv)'
        required: true
        default: 'PONER_URL_AQUÍ'
      nombre_pelicula:
        description: 'Nombre del archivo final terminado strictly en .mp4'
        required: true
        default: 'estreno_mutiny.mp4'

permissions:
  contents: write
  actions: write

jobs:
  descarga_bunker:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando espacio en el disco virtual de Microsoft
        uses: actions/checkout@v4

      # [REPARADO DEFINITIVO v5.6]: Volamos el setup-ffmpeg que crasheaba por culpa de Node 24.
      # Instalamos FFmpeg nativo por hardware directo desde las cañerías del sistema de Linux.
      - name: ⚙️ Instalación Directa de FFmpeg Nativo Inmune a Node
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq

      - name: 🚀 Clonación Satelital y Normalización de ADN Multimedia a la RAM
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v5.6 - DIEGO NODE24 FIXED]
          export TERM=xterm
          
          echo "📥 FASE 1: Succionando los bytes crudos de internet con el extractor inmune..."
          # [REPARADO DEFINITIVO v5.7]: Le encastramos re-intentos elásticos con delay.
          # Si Star Latino corta el chorro, curl insiste 5 veces automáticas re-enganchando el flete.
          curl -L -A "VLC/3.0.18 LibVLC/3.0.18" \
               --connect-timeout 10 \
               --retry 5 \
               --retry-delay 3 \
               -o descarga_cruda.mp4 "${{ github.event.inputs.url_pirata }}"

          if [ ! -s "descarga_cruda.mp4" ]; then
             echo "❌ El extractor de red se congeló o el link caducó en internet. Abortando."
             exit 1
          fi
          
          echo "✅ Descarga completada con éxito. Tamaño del archivo crudo:"
          du -sh descarga_cruda.mp4
          
          echo "📥 FASE 2: Applying el Molde de Titanio al archivo local en frío absolute..."
          ffmpeg -y -i descarga_cruda.mp4 \
            -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1:1[v_moldeado]" \
            -map "[v_moldeado]" -map 0:a:0? -r 30 -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -crf 22 -g 60 -keyint_min 60 \
            -c:a aac -b:a 128k -ac 2 -ar 44100 -async 1 "masterizado_temp.mp4"

          rm -f descarga_cruda.mp4

          # FASE 3: EL SENSOR DE CONTROL DE BOXES ANTI-2GB
          PESO_BYTES=$(stat -c%s "masterizado_temp.mp4")
          LIMITE_BYTES=2000000000 
          
          NOMBRE_SOLICITADO="${{ github.event.inputs.nombre_pelicula }}"
          BASE_NAME="${NOMBRE_SOLICITADO%.mp4}"

          if [ $PESO_BYTES -gt $LIMITE_BYTES ]; then
            echo "⚠️ [ALERTA DE HARDWARE] El archivo masterizado superó el límite de 2 GB."
            echo "✂️ Iniciando guillotina síncrona en dos partes exactas..."

            DURACION_TOTAL=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:keyvalue=1=0 masterizado_temp.mp4 | awk -F. '{print $1}')
            MITAD_TIEMPO=$((DURACION_TOTAL / 2))

            echo "🎞️ Duración total: $DURACION_TOTAL segundos. Cortando en el segundo: $MITAD_TIEMPO"

            ffmpeg -y -ss 0 -i masterizado_temp.mp4 -t $MITAD_TIEMPO -c copy -map 0 "parte_1.mp4"
            ffmpeg -y -ss $MITAD_TIEMPO -i masterizado_temp.mp4 -c copy -map 0 "${BASE_NAME}_2.mp4"

            mv parte_1.mp4 "$NOMBRE_SOLICITADO"
            rm -f masterizado_temp.mp4
            
            echo "✅ Guillotina ejecutada deBoxes."
            ls -lh *.mp4
          else
            echo "🟢 [HARDWARE SALUDABLE] El archivo está por debajo del límite administrativo."
            mv masterizado_temp.mp4 "$NOMBRE_SOLICITADO"
          fi

      - name: 💾 Inyectando el Video Intacto en las Releases Locales de esta Cuenta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bunker_mutiny"
          name: "📦 Mutiny TV - Base de Datos Privada Soberana"
          body: "Aquí viven tus películas resguardadas eternas en calidad HD unificada, SAR 1:1 y Keyframes sincronizados, listas para transmitir de corrido sin apagar el vivo."
          files: |
            *.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
