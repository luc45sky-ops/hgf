name: 📡 Mutiny TV IPTV Pirate Engine v900.5 - Headless SRT Test Core

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub

permissions:
  contents: write
  actions: write

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando espacio en el disco virtual
        uses: actions/checkout@v4

      # Instalamos el servidor gráfico fantasma Xvfb y las herramientas de renderizado
      - name: ⚙️ Instalando Servidor Gráfico Virtual y Codecs Nativos
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb vlc ffmpeg fonts-dejavu-core curl jq

      - name: 🚀 Emisión Satelital por Captura Inmune de Pantalla Cruda vía SRT
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v900.5 - HEADLESS SRT CRUDO CORE]
          export TERM=xterm
         
          URL_GIST_PLAYLIST="https://gist.githubusercontent.com/jav45dev-ctrl/dbe1c5ce7ae9ceb4596c07ddf99fab18/raw/playlist.txt"

          echo "📡 [MUTINY TV] INICIALIZANDO MONITOR FANTASMA EN LA RAM VIRTUAL..."
          # Creamos la pantalla invisible de 1280x720 a 24 bits de color en el display :99
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 2

          echo "📡 [MUTINY TV] SUCCIONANDO PLAYLIST REMOTA DESDE EL GIST..."
          curl -L -s "$URL_GIST_PLAYLIST" | tr -d '\r' | sed '/^$/d' > grilla_remota.txt

          # Fabricamos la lista nativa de archivos locales para que VLC no sufra tirones de red
          echo "# Lista local" > playlist_local.txt
          contador=1
          
          while read -r linea || [ -n "$linea" ]; do
            URL_INTERNET=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            if [ -n "$URL_INTERNET" ]; then
              echo "📥 Pre-descargando Tramo $contador al disco rígido virtual: $URL_INTERNET"
              curl -L -H "Authorization: token ${{ secrets.TOKEN_B }}" \
                   -H "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
                   -o "fideo_${contador}.mp4" "$URL_INTERNET"
              
              echo "fideo_${contador}.mp4" >> playlist_local.txt
              contador=$((contador + 1))
            fi
          done < grilla_remota.txt

          echo "🪓 [MUTINY] LANZANDO REPRODUCTOR MULTIMEDIA EN LA PANTALLA INVISIBLE..."
          # Arrancamos VLC en background apuntando a la lista local dentro del monitor virtual :99
          vlc --intf dummy --dummy-quiet --play-and-exit --playlist-autostart playlist_local.txt &
          sleep 2

          echo "📡 [MUTINY TV] ENCIENDIENDO CAÑO MAESTRO DE EMISIÓN SRT DE PANTALLA PURA..."
          
          # 🧠 [REPARADO DEFINITIVO v900.5 - BYPASS DE IMÁGENES PARÁSITAS]:
          # Volamos la plantilla, los crops y los overlays parásitos que te daban portazo.
          # FFmpeg filma strictly la pantalla cruda a 30 FPS y la inyecta por el tubo de SRT.
          # Cambiamos -f flv por -f mpegts inyectándole el chorizo entero de tu nueva clave de test.
          ffmpeg -y -f x11grab -video_size 1280x720 -i :99.0 \
            -pix_fmt yuv420p -r 30 -g 60 -keyint_min 60 \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 12000k \
            -f mpegts "srt://fa723fc1b171.srt.live-video.net:9000?streamid=sk_us-west-2_MqGIuZCjdkwn_W8taony5k1gvPaCz1F7MWd2Rd0QAvb&passphrase=vrdzu5pih7bmRaVralELJ2wlBzrQPgsp08kGoZmPTKkqlkbN8CPzuUEYUtJU5ivRJE6nBqIOGPr2V1Q" || true

          echo "🏁 La maratón en el monitor virtual ha finalizado. Satélite apagado."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        
