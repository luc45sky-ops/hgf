name: 📡 TRANSMISOR STRM2

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      - name: ⚙️ Instalando FFmpeg nativo por hardware en la nube
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl jq

      - name: 🚀 Emisión Directa Unificada hacia Kick Inmune a Caídas de Audio
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v710 - DIEGO LOCALIZED CONCAT CORE]
          export TERM=xterm
          
          echo "Cargando..." > letrero.txt
          echo "Cargando informes Mutiny..." > abajo.txt
          
          URL_GIST_NOTICIAS="https://gist.githubusercontent.com/jav45dev-ctrl/dbe1c5ce7ae9ceb4596c07ddf99fab18/raw/noticias.txt"
          URL_GIST_PLAYLIST="https://gist.githubusercontent.com/jav45dev-ctrl/dbe1c5ce7ae9ceb4596c07ddf99fab18/raw/playlist.txt"
         
          # Hilo de la marquesina inferior de noticias en background intacto
          while true; do curl -s "$URL_GIST_NOTICIAS" | head -n 1 | tr -d '\r\n' > abajo.txt; sleep 5; done &

          echo "📡 [MUTINY TV] SUCCIONANDO GRILLA PARA DESCARGA LOCAL..."
          
          # 1. Chupamos tu playlist del Gist privado
          curl -L -s "$URL_GIST_PLAYLIST" | tr -d '\r' | sed '/^$/d' > grilla_cruda.txt
          
          # Inicializamos la lista de reproducción local pura
          echo "# Lista de videos locales para concat" > playlist_local.txt
          
          contador=1
          
          # 2. EL EMBRAGUE SATELITAL: Descargamos tus fideos idénticos del Ladrón al disco virtual a 100 MB/s
          while read -r linea || [ -n "$linea" ]; do
            # Limpiamos la URL de internet eliminando espacios parásitos
            URL_INTERNET=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            
            if [ -n "$URL_INTERNET" ]; then
              echo "📥 Pre-descargando Tramo $contador de internet a la RAM: $URL_INTERNET"
              
              # Succiona el video saltando aduanas de GitHub con tu pasaporte TOKEN_B intacto
              curl -L -H "Authorization: token ${{ secrets.TOKEN_B }}" \
                   -H "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
                   -o "local_part_${contador}.mp4" "$URL_INTERNET"
              
              # Le encastramos strictly el archivo local al bloc de notas
              echo "file 'local_part_${contador}.mp4'" >> playlist_local.txt
              contador=$((contador + 1))
            fi
          done < grilla_cruda.txt

          echo "🪓 [MUTINY] DETECTANDO PRIMER TÍTULO DE MARATÓN..."
          PRIMERA_LINEA=$(head -n 1 grilla_cruda.txt)
                  echo "🪓 [MUTINY] DETECTANDO PRIMER TÍTULO DE MARATÓN..."
          PRIMERA_LINEA=$(head -n 1 grilla_cruda.txt)
          TITULO_INICIAL=$(echo "$PRIMERA_LINEA" | awk -F'|' '{print $2}' | sed 's/^[ \t]*//;s/[ \t]*$//')
          
          # [REPARADO DEFINITIVO v710.5]: Si el Gist no tiene título, le clava strictly tu cuenta de TikTok.
          # Envolverlo entre comillas dobles blinda el @streamdrome contra cualquier crash de Bash en la Actions.
          echo "${TITULO_INICIAL:-sigueme en tiktok @streamdrome}" > letrero.txt


          echo "🪓 [MUTINY] COMPROBANDO LA CAÑERÍA LOCAL RE-DIRECCIONADA:"
          cat playlist_local.txt

          echo "📡 [MUTINY TV] ENCIENDIENDO CAÑO MAESTRO DE EMISIÓN DE LARGO FLUIDO ETERNO..."
          
          # 3. EL REMACHE DEF_INITIVO: FFmpeg corre en frío sobre archivos locales puros.
          # Volamos los flags cruzados -headers y -reconnect que te daban portazo en la nuca.
          # Mantiene intactos tus contrastes, el crop, tu drawtext y tu Stream Key de Kick de Boxes.
          ffmpeg -y \
            -fflags +genpts+igndts+flush_packets+discardcorrupt+nofillin -re -async 1 \
            -f concat -safe 0 \
            -i playlist_local.txt \
            -re -loop 1 -i plantilla_horizontal.png \
            -filter_complex "[0:v]scale=1280:720,crop=1270:710:5:5,eq=contrast=1.12:brightness=0.02,rotate=0.012:ow=1280:oh=720:fillcolor=black[peli_expandida]; [1:v]scale=1280:720[fondo_base]; [fondo_base][peli_expandida]overlay=0:0:shortest=1[canvas_parcial]; [canvas_parcial]drawtext=textfile=letrero.txt:reload=1:x=30:y=25:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.6:boxborderw=5,drawtext=textfile=abajo.txt:reload=1:x=30:y=665:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.5:boxborderw=4[canvas_fusionado]" \
            -r 30 -g 60 -keyint_min 60 -map 0:a:0? -map "[canvas_fusionado]" -sn -dn -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 12000k \
            -c:a aac -b:a 128k -ac 2 -ar 44100 -af aresample=async=1 \
            -f mpegts 'srt://fa723fc1b171.srt.live-video.net:9000?streamid=sk_us-west-2_yb6F1b18xTEE_QpaA7pm407C0FAAGgZPTqZHvtIJM2Q&passphrase=TNdOSyQpbrmfMc85yiQmEOTXpabTk4fDiu5tou4DGeJHknaCGXcuLjZgDUxzZi36DE1kqYR5ASxK0UR' || true

          echo "🏁 La maratón ha finalizado de largo fluido. Satélite apagado."


          echo "🏁 La maratón ha finalizado de largo fluido. Satélite apagado."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
