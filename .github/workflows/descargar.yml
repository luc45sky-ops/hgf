name: 📡 Mutiny TV - Ladrón de Contenido Síncrono Local

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub con 2 casilleros
    inputs:
      url_pirata:
        description: 'Chorizo de link a clonar (m3u8, mp4, mkv)'
        required: true
        default: 'PONER_URL_AQUÍ'
      nombre_pelicula:
        description: 'Nombre del archivo final terminado strictly en .mp4'
        required: true
        default: 'estreno_mutiny.mp4'

jobs:
  descarga_bunker:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando espacio en el disco virtual de Microsoft
        uses: actions/checkout@v4

      - name: ⚙️ Instalando herramientas de disección multimedia por hardware
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq

      - name: 🚀 Clonación Satelital Síncrona Ultra-HD a la RAM Local
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL - DIEGO LOCAL FIXED]
          export TERM=xterm
          
          echo "📥 Descargando fideo digital útil con embrague síncrono de audio..."
          # Copia de video a 60x espacial + re-muestreo de audio estéreo estándar de televisión.
          # El flag -async 1 clava los imanes de las pistas borrando el delay de sonido de raíz.
          ffmpeg -y -headers "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "${{ github.event.inputs.url_pirata }}" -c:v copy -c:a aac -ac 2 -ar 44100 -async 1 \
            -bsf:a aac_adtstoasc "${{ github.event.inputs.nombre_pelicula }}" || true

          # Verificación de chapa anti-bancarrota de tus datos móviles
          if [ ! -s "${{ github.event.inputs.nombre_pelicula }}" ]; then
             echo "❌ El caño de red se congeló o el link caducó en internet. Abortando."
             exit 1
          fi
          
          echo "✅ Película clonada al 100% de calidad Bluray original. Peso total:"
          du -sh "${{ github.event.inputs.nombre_pelicula }}"

      - name: 💾 Inyectando el Video Intacto en las Releases Locales de esta Cuenta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bunker_mutiny"
          name: "📦 Mutiny TV - Base de Datos Privada Soberana"
          body: "Aquí viven tus películas resguardadas eternas en calidad Ultra-HD y audio síncrono perfecto, listas para transmitir o usar en Surge."
          files: "${{ github.event.inputs.nombre_pelicula }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
