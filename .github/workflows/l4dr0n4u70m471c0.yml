name: 📡 Mutiny TV - Ladrón de Contenido Síncrono Automático v6.2

on:
  workflow_dispatch: # Se prende con un único botón de PLAY manual en la web de GitHub

permissions:
  contents: write
  actions: write

jobs:
  descarga_bunker:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando espacio en el disco virtual de Microsoft
        uses: actions/checkout@v4

      # Setup FFmpeg ultra-rápido en la máquina virtual de Actions
      - name: ⚙️ Setup FFmpeg Nativo en la Nube
        uses: federicocarboni/setup-ffmpeg@v3

      - name: 🚀 Extracción en Cadena Directa e Inmune a Bloqueos de Tamaño
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v6.2 - BYPASS DE FLUJO DIRECTO COMPLETO]
          export TERM=xterm
          
          echo "📡 [MUTINY TV] SUCCIONANDO ÓRDENES DE TRABAJO DESDE EL GIST..."
          
          # 1. Chupamos tu playlist unificada de descargas desde tu nuevo Gist privado
          curl -s "https://gist.githubusercontent.com/luc45sky-ops/6702432997e21ae694117f82c0844ed6/raw/gistfile1.txt" | tr -d '\r' | sed '/^$/d' > ordenes_bunker.txt
         
          contador=1
          
          # 2. EL REMACHE MAESTRO DE AJEDREZ: Usamos el descriptor de archivos 3 (<&3)
          # Esto blinda el bucle while para que ffmpeg jamás interfiera con los renglones de la lista.
          while read -r linea <&3 || [ -n "$linea" ]; do
            URL_PIRATA=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            NOMBRE_FINAL=$(echo "$linea" | awk -F'|' '{print $2}' | tr -d ' ')
            
            if [ -n "$URL_PIRATA" ] && [ -n "$NOMBRE_FINAL" ]; then
              echo "------------------------------------------------------------"
              echo "🍿 [PROCESANDO TRABAJO N° $contador]: $NOMBRE_FINAL"
              echo "------------------------------------------------------------"
              
              echo "📥 FASE ÚNICA: Extrayendo, Remuestreando y Purificando el Flujo Directo por Red..."
              # [BYPASS ADAPTATIVO]: Conectamos ffmpeg directo a la URL de origen (soporta .mkv y .mpd).
              # Metemos parámetros de reconexión automática en caliente para tolerar los cortes del servidor IPTV.
              ffmpeg -y -nostdin \
                -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
                -user_agent "VLC/3.0.18 LibVLC/3.0.18" -i "$URL_PIRATA" \
                -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1:1[v_moldeado]" \
                -map "[v_moldeado]" -map 0:a:0? -r 30 -pix_fmt yuv420p \
                -c:v libx264 -preset ultrafast -crf 22 -g 60 -keyint_min 60 \
                -c:a aac -b:a 128k -ac 2 -ar 44100 -async 1 "$NOMBRE_FINAL" || { echo "⚠️ Falló la extracción del fideo. Saltando..."; rm -f "$NOMBRE_FINAL"; contador=$((contador + 1)); continue; }
                
              echo "💾 FASE DE COFRE: Inyectando el video masterizado en el cofre bunker_mutiny..."
              gh release upload bunker_mutiny "$NOMBRE_FINAL" --clobber || echo "⚠️ Falló la subida de chapa."
              
              echo "🪓 FASE DE PURGA: Reseteando espacio de disco virtual..."
              # Rompemos el archivo local procesado. El espacio en disco de Microsoft vuelve a 0 MB antes del siguiente ciclo.
              rm -f "$NOMBRE_FINAL"
              
              echo "✅ TRABAJO N° $contador COMPLETADO CON ÉXITO ABSOLUTO."
              contador=$((contador + 1))
            fi
          done 3< ordenes_bunker.txt # Canal de lectura blindado rígido de boxes
          
          echo "🏁 [MUTINY TV] Toda la cartelera del Gist fue clonada de largo fluido. Estante lleno."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

