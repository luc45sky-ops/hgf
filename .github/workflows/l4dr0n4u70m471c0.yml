name: 📡 Mutiny TV - Ladrón de Contenido Síncrono Masivo Automatizado v7.0

on:
  workflow_dispatch: # Se prende con un único botón de PLAY manual en la web de GitHub

permissions:
  contents: write
  actions: write

jobs:
  descarga_bunker:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando espacio en el disco virtual de Microsoft
        uses: actions/checkout@v4

      # Instalamos las herramientas de disección multimedia por hardware nativas
      - name: ⚙️ Instalando herramientas de disección multimedia
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq

      - name: 🚀 Bucle Automatizado - Extracción en Cadena e Inmune a Bloqueos de Tamaño
        run: |
          # 🪓 [REACTOR INTEGRADO v7.0 - DIEGO GIST PARSER & PURGE CORE]
          export TERM=xterm
          
          echo "📡 [MUTINY TV] SUCCIONANDO ÓRDENES DE TRABAJO DESDE EL GIST..."
          
          # 1. Chupamos tu playlist de descargas desde tu nuevo Gist privado de luc45sky-ops
          curl -s "https://gist.githubusercontent.com/luc45sky-ops/6702432997e21ae694117f82c0844ed6/raw/gistfile1.txt" | tr -d '\r' | sed '/^$/d' > ordenes_bunker.txt
          
          contador=1
          
          # 2. El descriptor de archivos 3 (<&3) blinda el bucle para que ffmpeg no se robe renglones
          while read -r linea <&3 || [ -n "$linea" ]; do
            URL_PIRATA=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            NOMBRE_FINAL=$(echo "$linea" | awk -F'|' '{print $2}' | tr -d ' ')
            
            if [ -n "$URL_PIRATA" ] && [ -n "$NOMBRE_FINAL" ]; then
              echo "------------------------------------------------------------"
              echo "🍿 [PROCESANDO TRABAJO N° $contador]: $NOMBRE_FINAL"
              echo "🔗 Link de Origen: $URL_PIRATA"
              echo "------------------------------------------------------------"
              
              echo "📥 FASE 1: Clonación Satelital Síncrona Directa a la RAM..."
              # Usamos el comando exacto de tu script funcional que clava el audio y evita el delay
              ffmpeg -y -nostdin -headers "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
                -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
                -i "$URL_PIRATA" -c:v copy -c:a aac -ac 2 -ar 44100 -async 1 \
                -bsf:a aac_adtstoasc "$NOMBRE_FINAL" || true

              # Verificación de chapa anti-archivo vacío
              if [ ! -s "$NOMBRE_FINAL" ]; then
                 echo "⚠️ El caño de red falló o el link caducó para el Renglón $contador. Saltando..."
                 rm -f "$NOMBRE_FINAL"
                 contador=$((contador + 1))
                 continue
              fi
              
              echo "✅ Película clonada al 100%. Peso total del binario:"
              du -sh "$NOMBRE_FINAL"
              
              echo "💾 FASE 2: Inyectando el Video Intacto en las Releases usando la API oficial..."
              # Usamos la fuerza de gh de forma unitaria para subir el archivo limpio
              gh release upload bunker_mutiny "$NOMBRE_FINAL" --clobber || echo "⚠️ Falló la subida de chapa."
              
              echo "🪓 FASE 3: EL SEGURO DE TITANIO - PURGA TOTAL DEL DISCO EN CALIENTE..."
              # Rompemos el archivo local procesado. El espacio en disco de Microsoft vuelve a 0 MB
              # absolutos antes de que empiece a leer el siguiente renglón del Gist.
              rm -f "$NOMBRE_FINAL"
              
              echo "✅ TRABAJO N° $contador COMPLETADO CON ÉXITO ABSOLUTO."
              contador=$((contador + 1))
            fi
          done 3< ordenes_bunker.txt # Canal de lectura blindado rígido de boxes
          
          echo "🏁 [MUTINY TV] Toda la cartelera del Gist fue clonada de largo fluido. Estante lleno."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
